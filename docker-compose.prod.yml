# Production compose for the Pussalla Incentive System.
# Builds the app + Postgres into a single deployable stack.
#
# Usage:
#   1. Copy pussalla-backend/.env.example to .env and set real secrets
#      (PGPASSWORD, JWT_SECRET, CORS_ORIGIN).
#   2. docker compose -f docker-compose.prod.yml up --build -d
#   3. docker compose exec app npm run seed   # load demo data
#   4. Open http://localhost:4000  (login EMP-001 / Pussalla@123)

version: "3.8"
services:
  db:
    image: postgres:16
    container_name: pussalla-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-pussalla}
      POSTGRES_USER: ${PGUSER:-pussalla_app}
      POSTGRES_PASSWORD: ${PGPASSWORD:-change_me}
    volumes:
      - pussalla_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-pussalla_app} -d ${PGDATABASE:-pussalla}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pussalla-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-pussalla}
      PGUSER: ${PGUSER:-pussalla_app}
      PGPASSWORD: ${PGPASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      NODE_ENV: production
      SERVE_FRONTEND: "true"
      PORT: 4000
    ports:
      - "${PORT:-4000}:4000"

volumes:
  pussalla_pgdata:
